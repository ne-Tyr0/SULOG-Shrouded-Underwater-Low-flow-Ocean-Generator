<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SULOG 3D Model</title>
<meta name="description" content="3D model of SULOG, a ducted tidal turbine. Bench prototype and market-ready concept. ERobolution 2026.">
<style>
html,body{margin:0;height:100%;background:#EDF2F1;color:#0D2B33;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;align-items:flex-start;pointer-events:none}
.tag{margin:0}
.tag b{display:block;font-size:28px;font-weight:800;letter-spacing:-.01em}
.tag span{font-size:13px;color:#33505A}
.tabs{display:inline-flex;background:#E1E9E8;border:1px solid #C5D4D2;border-radius:12px;padding:3px;gap:2px;pointer-events:auto}
button{font:600 14px/1 system-ui,-apple-system,'Segoe UI',sans-serif;border:0;border-radius:9px;padding:0 14px;min-height:44px;cursor:pointer;color:#33505A;background:transparent}
.tabs button[aria-pressed="true"]{background:#fff;color:#0D2B33;box-shadow:0 1px 3px rgba(13,43,51,.15)}
.bottom{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#ex{pointer-events:auto;background:#fff;border:1px solid #C5D4D2;color:#0D2B33}
#ex[aria-pressed="true"]{background:#0F6E62;border-color:#0F6E62;color:#fff}
.hint{margin:0;font-size:13px;color:#4F666D;background:rgba(237,242,241,.85);padding:5px 10px;border-radius:8px;white-space:nowrap}
.msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;font-size:14px;color:#33505A}
button:focus-visible{outline:2px solid #0F6E62;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="3D model of SULOG. Drag to rotate, pinch or scroll to zoom."></canvas>
<div class="top">
  <p class="tag"><b>SULOG</b><span>Shrouded Underwater Low-flow Ocean Generator</span></p>
  <div class="tabs" role="group" aria-label="Model">
    <button type="button" data-m="rig" aria-pressed="true">Prototype</button>
    <button type="button" data-m="mvp" aria-pressed="false">Market-ready model</button>
  </div>
</div>
<div class="bottom">
  <button type="button" id="ex" aria-pressed="false">Exploded view</button>
  <p class="hint">Drag to rotate · Pinch to zoom</p>
</div>
<p class="msg" id="msg">Loading 3D model…</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script>
(function(){
var T=window.THREE, msg=document.getElementById('msg'), exBtn=document.getElementById('ex');
if(!T){ msg.textContent='Could not load the 3D viewer. Check your connection and reload.'; return; }
var canvas=document.getElementById('c');
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var camera=new T.PerspectiveCamera(35,1,0.01,20000);
var controls=new T.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.autoRotate=true; controls.autoRotateSpeed=0.8;
canvas.addEventListener('pointerdown',function(){ controls.autoRotate=false; });
var loader=new T.GLTFLoader(); if(window.MeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);

/* parts left out of the framing; the loop plumbing also hides when exploded */
var FADE={sump:1,pump:1,hoseIn:1,hoseOut:1,clamps:1,wires:1};
var NOFRAME={lid:1,table:1,uno:1,oled:1,breadboard:1,circuitHave:1,circuitBuy:1};
var M={rig:{file:'model/sulog_rig.glb'},mvp:{file:'model/sulog_mvp.glb'}};
var cur=null, ex=0, exTarget=0;

function load(key){
  var m=M[key]; if(m.scene) return Promise.resolve(m);
  return new Promise(function(res,rej){
    loader.load(m.file,function(g){
      var sc=new T.Scene(); sc.background=new T.Color(0xEDF2F1); sc.add(g.scene);
      m.parts=[]; var box=new T.Box3();
      g.scene.traverse(function(o){ var u=o.userData||{};
        if(u.label&&u.pid&&!o.userData.done){ o.userData.done=true; o.userData.base=o.position.clone(); m.parts.push(o);
          if(!FADE[u.pid]&&!NOFRAME[u.pid]&&!u.bg) box.expandByObject(o); } });
      if(box.isEmpty()) box.setFromObject(g.scene);
      var s=box.getSize(new T.Vector3()).length();
      sc.add(new T.HemisphereLight(0xffffff,0x8a9a98,0.85));
      var d1=new T.DirectionalLight(0xffffff,0.75); d1.position.set(-0.6*s,1.2*s,0.9*s); sc.add(d1);
      var d2=new T.DirectionalLight(0xffffff,0.3); d2.position.set(0.8*s,0.4*s,-0.7*s); sc.add(d2);
      m.box=box; m.scene=sc; res(m);
    },undefined,rej);
  });
}
function frame(m,key){
  var c=m.box.getCenter(new T.Vector3()), r=m.box.getSize(new T.Vector3()).length()/2;
  var fov=camera.fov*Math.PI/180, hf=2*Math.atan(Math.tan(fov/2)*camera.aspect);
  var dist=camera.aspect<1? r/Math.tan(hf/2) : r/Math.sin(fov/2)*0.95;
  if(key==='mvp') dist*=1.15;
  var dir=key==='rig'?new T.Vector3(-0.55,0.5,0.95):new T.Vector3(0.6,0.35,0.9);
  camera.position.copy(c).add(dir.normalize().multiplyScalar(dist));
  camera.near=dist/300; camera.far=dist*60; camera.updateProjectionMatrix();
  controls.target.copy(c); controls.minDistance=dist*0.05; controls.maxDistance=dist*6; controls.update();
}
function applyEx(){
  if(!cur) return; var e=ex*ex*(3-2*ex);
  cur.m.parts.forEach(function(p){ var d=p.userData.ex||[0,0,0], b=p.userData.base;
    p.position.set(b.x+d[0]*e,b.y+d[1]*e,b.z+d[2]*e);
    if(FADE[p.userData.pid]) p.visible=ex<0.3; });
}
function show(key){
  msg.hidden=false; msg.textContent='Loading 3D model…';
  load(key).then(function(m){
    cur={key:key,m:m}; ex=exTarget; applyEx(); frame(m,key); msg.hidden=true; controls.autoRotate=true;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-m')===key)); });
  }).catch(function(){ msg.textContent='The model did not load. Reload the page to try again.'; });
}
document.querySelector('.tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b&&(!cur||b.getAttribute('data-m')!==cur.key)) show(b.getAttribute('data-m')); });
exBtn.addEventListener('click',function(){ exTarget=exTarget?0:1; exBtn.setAttribute('aria-pressed',String(!!exTarget)); });
function resize(){ var w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
var last=performance.now();
(function tick(now){ now=now||performance.now(); var dt=Math.min(0.25,(now-last)/1000); last=now;
  if(cur){ if(Math.abs(ex-exTarget)>0.001){ ex+=Math.sign(exTarget-ex)*Math.min(Math.abs(exTarget-ex),dt*1.6); applyEx(); }
    controls.update(); renderer.render(cur.m.scene,camera); }
  requestAnimationFrame(tick); })();
show('rig');
})();
</script>
</body>
</html>
